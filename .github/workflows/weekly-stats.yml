# 매주 월요일 09:00(KST) GoatCounter 통계를 받아 stats 브랜치에 저장한다.
# 필요: 저장소 Settings → Secrets and variables → Actions 에 GOATCOUNTER_TOKEN (Read statistics 권한 API 키)
name: weekly-stats
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: 통계 받기
        env:
          TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        shell: python
        run: |
          import json, os, time, datetime as dt, urllib.request, urllib.parse, urllib.error
          API = "https://jarotrip.goatcounter.com/api/v0/"
          KST = dt.timezone(dt.timedelta(hours=9))
          today = dt.datetime.now(KST).replace(hour=0, minute=0, second=0, microsecond=0)
          def utc(t): return t.astimezone(dt.timezone.utc).strftime("%Y-%m-%dT%H:00:00Z")
          def get(path, **q):
              url = API + path + "?" + urllib.parse.urlencode(q)
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["TOKEN"], "Content-Type": "application/json"})
              for i in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          time.sleep(1); return json.load(r)
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")[:500]
                      if e.code == 429: time.sleep(5); continue
                      print("ERROR", path, e.code, body); return {"error": e.code, "body": body, "url": url.split("?")[0]}
                  except Exception as e:
                      print("ERROR", path, e); return {"error": str(e)}
              return {"error": 429}
          out = {"fetchedAt": dt.datetime.now(KST).isoformat(timespec="seconds")}
          for w, back in (("this", 0), ("prev", 7)):
              s = today - dt.timedelta(days=7 + back); e = today - dt.timedelta(days=back)
              q = {"start": utc(s), "end": utc(e)}
              out[w + "-range"] = {"start": s.date().isoformat(), "end": (e - dt.timedelta(days=1)).date().isoformat()}
              out[w + "-total"] = get("stats/total", **q)
              out[w + "-hits"] = get("stats/hits", limit=100, **q)
              for p in ("toprefs", "browsers", "systems", "sizes", "locations"):
                  out[w + "-" + p] = get("stats/" + p, limit=30, **q)
          json.dump(out, open("latest.json", "w"), ensure_ascii=False)
          print(json.dumps({k: (v if "error" in str(v)[:20] else "ok") for k, v in out.items()}, ensure_ascii=False)[:2000])
      - name: stats 브랜치에 저장
        run: |
          git config --global user.name "jarotrip-stats"
          git config --global user.email "actions@users.noreply.github.com"
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone -q --depth 1 --branch stats "$R" s 2>/dev/null || { mkdir s && cd s && git init -q -b stats && git remote add origin "$R" && cd ..; }
          cd s && day=$(TZ=Asia/Seoul date +%F)
          cp ../latest.json latest.json && cp ../latest.json "week-$day.json"
          git add -A && git commit -qm "stats: $day" && git push -q origin stats
