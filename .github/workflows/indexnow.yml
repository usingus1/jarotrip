# main 에 새 내용이 올라가면(매일 데이터 갱신 포함) 검색엔진에 "페이지가 바뀌었어요"라고 알린다.
# IndexNow: 네이버·빙(다음 검색 일부 포함)·얀덱스 등이 함께 받는다. 키 파일은 저장소 맨 위의 3c1d5c388b4fda7e846da6a6e4ba9a31.txt
name: indexnow
on:
  push:
    branches: [main]
    paths: ["index.html", "city/**", "sitemap.xml", "clinics.json", "travel.json", "stays.json"]
  schedule:
    - cron: "40 23 * * *"   # 매일 08:40 KST (아침 데이터 갱신 뒤)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages 반영 기다리기
        run: sleep 90
      - name: 검색엔진에 알리기
        shell: python
        run: |
          import json, urllib.request
          KEY = "3c1d5c388b4fda7e846da6a6e4ba9a31"; HOST = "usingus1.github.io"; BASE = "https://usingus1.github.io/jarotrip/"
          urls = [BASE] + [BASE + "city/" + c + ".html" for c in ("tokyo","fukuoka","osaka","nagoya","sapporo","hiroshima","kyoto","kagoshima")]
          body = json.dumps({"host": HOST, "key": KEY, "keyLocation": BASE + KEY + ".txt", "urlList": urls}).encode()
          for ep in ("https://api.indexnow.org/indexnow", "https://searchadvisor.naver.com/indexnow"):
              req = urllib.request.Request(ep, data=body, method="POST", headers={"Content-Type": "application/json; charset=utf-8"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: print(ep, r.status)
              except Exception as e:
                  print(ep, "실패:", e)
